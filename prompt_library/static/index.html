<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prompt Library</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-2: #171a23;
    --bg-3: #1f2430;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --text-dim: #9aa3b5;
    --accent: #6c8cff;
    --accent-2: #8b5cf6;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    background: var(--bg-2); position: sticky; top: 0; z-index: 20;
  }
  header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  header h1 .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(108,140,255,.6);
  }
  .btn {
    background: var(--bg-3); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px;
    transition: all .15s ease; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.12); color: #fff; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 28px 60px; }

  /* ---- toolbar ---- */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 200px; background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px;
  }
  .toolbar input[type="search"]:focus { outline: none; border-color: var(--accent); }
  .toolbar select {
    background: var(--bg-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; font-size: 13px; cursor: pointer;
  }

  /* ---- template grid ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: all .15s ease; display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .card h3 { font-size: 15px; font-weight: 600; }
  .card .category {
    align-self: flex-start; background: rgba(108,140,255,.12); color: var(--accent);
    border: 1px solid rgba(108,140,255,.3); padding: 2px 8px; border-radius: 20px; font-size: 11px;
  }
  .card p.desc { font-size: 13px; color: var(--text-dim); line-height: 1.45; flex: 1; }
  .card .body-preview {
    font-size: 12px; color: var(--text-dim); background: var(--bg-3);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; max-height: 72px; overflow: hidden;
    white-space: pre-wrap; line-height: 1.4;
  }
  .card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-dim); }
  .card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    background: var(--bg-3); border: 1px solid var(--border); color: var(--accent-2);
    font-size: 10.5px; padding: 2px 7px; border-radius: 12px; font-family: Consolas, monospace;
  }
  .card-actions { display: flex; gap: 6px; }

  /* ---- modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(5,7,12,.72); display: none;
    align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 40px 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 640px; padding: 24px; animation: pop .18s ease;
  }
  @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h2 { font-size: 17px; margin-bottom: 18px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .form-row input, .form-row textarea, .form-row select {
    width: 100%; background: var(--bg-3); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-family: inherit;
  }
  .form-row textarea { resize: vertical; min-height: 120px; font-family: Consolas, monospace; line-height: 1.5; }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .live-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 22px; }
  .chip.hl { background: rgba(139,92,246,.15); border-color: rgba(139,92,246,.5); color: var(--accent-2); }
  .hint { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  .error-text { color: var(--red); font-size: 12px; margin-top: 4px; min-height: 15px; }

  /* ---- fill-in / render view ---- */
  .render-view { display: none; }
  .render-view.open { display: block; }
  .back-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; margin-bottom: 16px; }
  .render-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .render-header h2 { font-size: 17px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .panel { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; background: var(--bg-3); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input.invalid, .field textarea.invalid { border-color: var(--red); }
  .field .err { color: var(--red); font-size: 11.5px; min-height: 15px; margin-top: 3px; }
  .render-toolbar { display: flex; gap: 8px; margin-top: 14px; }
  pre#output {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; min-height: 160px; max-height: 480px; overflow: auto;
    white-space: pre-wrap; word-break: break-word; font-family: Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; color: var(--text);
  }
  .copy-badge { color: var(--green); font-size: 12px; margin-left: 8px; opacity: 0; transition: opacity .3s; }
  .copy-badge.show { opacity: 1; }
  .missing-note { font-size: 12px; color: var(--amber); margin-top: 8px; display: none; }
  .missing-note.show { display: block; }

  /* ---- history ---- */
  .history-section { margin-top: 32px; }
  .history-section h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; }
  .h-item {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; cursor: pointer; transition: border-color .15s;
  }
  .h-item:hover { border-color: var(--accent); }
  .h-item .h-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .h-item .h-name { font-size: 13px; font-weight: 600; }
  .h-item .h-time { font-size: 11px; color: var(--text-dim); }
  .h-item pre {
    font-size: 11.5px; color: var(--text-dim); background: var(--bg-3); border-radius: 6px;
    padding: 8px; max-height: 70px; overflow: hidden; white-space: pre-wrap; margin-top: 6px;
  }
  .h-item .h-vars { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .h-item .h-vars .chip { font-size: 10px; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 24px 0; }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 13px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(12px);
    transition: all .25s ease; z-index: 100; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.error { border-color: var(--red); color: var(--red); }
  .spinner { display: none; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span> Prompt Library</h1>
  <button class="btn primary" id="btnNew">+ New Template</button>
</header>

<main>
  <!-- ============ LIBRARY VIEW ============ -->
  <section id="libraryView">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search templates..." autocomplete="off" />
      <select id="categoryFilter"><option value="">All categories</option></select>
      <button class="btn" id="btnClearFilters">Clear</button>
    </div>
    <div id="templateGrid" class="grid"></div>
    <div id="libraryEmpty" class="empty" style="display:none;">No templates found. Create your first one!</div>
  </section>

  <!-- ============ FILL-IN / RENDER VIEW ============ -->
  <section id="renderView" class="render-view">
    <button class="back-link" id="btnBack">← Back to library</button>
    <div class="render-header">
      <h2 id="renderTitle"></h2>
      <span class="chip" id="renderCategory"></span>
    </div>
    <p id="renderDesc" style="color:var(--text-dim);font-size:13px;"></p>
    <div class="two-col">
      <div class="panel">
        <h3>Fill in variables</h3>
        <div id="fillForm"></div>
        <div class="render-toolbar">
          <button class="btn primary" id="btnRender">Render Prompt</button>
          <button class="btn" id="btnResetForm">Reset</button>
        </div>
      </div>
      <div class="panel">
        <h3>Rendered prompt</h3>
        <pre id="output" placeholder="Rendered output will appear here..."></pre>
        <div class="render-toolbar">
          <button class="btn" id="btnCopy">Copy to Clipboard</button>
          <span class="copy-badge" id="copyBadge">✓ Copied</span>
        </div>
        <div class="missing-note" id="missingNote"></div>
      </div>
    </div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="history-section">
    <h2>Recent generations
      <button class="btn danger small" id="btnClearHistory">Clear history</button>
    </h2>
    <div id="historyList" class="history-list"></div>
  </section>
</main>

<!-- ============ TEMPLATE EDITOR MODAL ============ -->
<div class="modal-backdrop" id="editorModal">
  <div class="modal">
    <h2 id="editorTitle">New Template</h2>
    <div class="form-row">
      <label for="fName">Name *</label>
      <input id="fName" type="text" placeholder="e.g. Code Review Request" />
      <div class="error-text" id="errName"></div>
    </div>
    <div class="form-row">
      <label for="fCategory">Category / Use case *</label>
      <input id="fCategory" type="text" placeholder="e.g. code review" list="categoryOptions" />
      <datalist id="categoryOptions"></datalist>
      <div class="error-text" id="errCategory"></div>
    </div>
    <div class="form-row">
      <label for="fDescription">Description</label>
      <input id="fDescription" type="text" placeholder="Short description of when to use this prompt" />
    </div>
    <div class="form-row">
      <label for="fBody">Prompt body * <span class="hint">— use {{variable}} placeholders</span></label>
      <textarea id="fBody" placeholder="Please review the following code: {{code_snippet}} ..."></textarea>
      <div class="live-chips" id="liveChips"></div>
      <div class="error-text" id="errBody"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnCancel">Cancel</button>
      <button class="btn primary" id="btnSave">Save Template</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const API = {
  templates: "/api/templates",
  history: "/api/history",
  render: (id) => `/api/templates/${id}/render`,
};

const state = {
  templates: [],
  categories: new Set(),
  currentTemplate: null,   // template being filled in
  editingId: null,         // template being edited in modal
};

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      if (body.detail) detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch (_) { /* keep statusText */ }
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  if (res.status === 204) return null;
  return res.json();
}

let toastTimer = null;
function toast(msg, isError = false) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.toggle("error", isError);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function detectPlaceholders(body) {
  const seen = [];
  const re = /\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g;
  let m;
  while ((m = re.exec(body)) !== null) {
    if (!seen.includes(m[1])) seen.push(m[1]);
  }
  return seen;
}

// ---------------------------------------------------------------------------
// Library view
// ---------------------------------------------------------------------------
async function loadTemplates() {
  try {
    const data = await api(API.templates);
    state.templates = data.templates;
    renderGrid();
    updateCategoryOptions();
  } catch (e) {
    toast("Failed to load templates: " + e.message, true);
  }
}

function filteredTemplates() {
  const q = $("#searchInput").value.trim().toLowerCase();
  const cat = $("#categoryFilter").value;
  return state.templates.filter((t) => {
    if (cat && t.category !== cat) return false;
    if (q) {
      const hay = (t.name + " " + t.description + " " + t.body).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderGrid() {
  const grid = $("#templateGrid");
  const items = filteredTemplates();
  grid.innerHTML = items.map((t) => `
    <div class="card" data-id="${esc(t.id)}">
      <span class="category">${esc(t.category)}</span>
      <h3>${esc(t.name)}</h3>
      <p class="desc">${esc(t.description || "No description.")}</p>
      <div class="body-preview">${esc(t.body)}</div>
      <div class="meta">
        <span>${t.placeholders.length} variable${t.placeholders.length === 1 ? "" : "s"}</span>
        <span>${new Date(t.created_at).toLocaleDateString()}</span>
      </div>
      <div class="chips">${t.placeholders.slice(0, 6).map((p) => `<span class="chip">{{${esc(p)}}}</span>`).join("")}</div>
      <div class="card-actions">
        <button class="btn small primary" data-action="fill">Use this template</button>
        <button class="btn small" data-action="edit">Edit</button>
        <button class="btn small danger" data-action="delete">Delete</button>
      </div>
    </div>
  `).join("");
  $("#libraryEmpty").style.display = items.length ? "none" : "block";
}

function updateCategoryOptions() {
  state.categories = new Set(state.templates.map((t) => t.category));
  const sel = $("#categoryFilter");
  const current = sel.value;
  sel.innerHTML = `<option value="">All categories</option>` +
    [...state.categories].sort().map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  sel.value = current; // preserve selection across reloads
}

// ---------------------------------------------------------------------------
// Fill-in / render view
// ---------------------------------------------------------------------------
function openRenderView(t) {
  state.currentTemplate = t;
  $("#libraryView").style.display = "none";
  $("#renderView").classList.add("open");
  $("#renderTitle").textContent = t.name;
  $("#renderCategory").textContent = t.category;
  $("#renderDesc").textContent = t.description || "";
  $("#output").textContent = "";
  $("#missingNote").classList.remove("show");
  $("#copyBadge").classList.remove("show");
  buildFillForm(t.placeholders);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function buildFillForm(placeholders) {
  const form = $("#fillForm");
  if (!placeholders.length) {
    form.innerHTML = `<p style="color:var(--text-dim);font-size:13px;">This template has no placeholders — just press Render.</p>`;
    return;
  }
  form.innerHTML = placeholders.map((p) => `
    <div class="field" data-var="${esc(p)}">
      <label for="var_${esc(p)}">${esc(p)}</label>
      <textarea id="var_${esc(p)}" rows="2" placeholder="Value for {{${esc(p)}}}..."></textarea>
      <div class="err"></div>
    </div>
  `).join("");
}

function collectVariables() {
  const vars = {};
  let firstInvalid = null;
  $("#fillForm").querySelectorAll(".field").forEach((field) => {
    const name = field.dataset.var;
    const input = field.querySelector("textarea");
    const errEl = field.querySelector(".err");
    input.classList.remove("invalid");
    errEl.textContent = "";
    const value = input.value.trim();
    if (!value) {
      input.classList.add("invalid");
      errEl.textContent = "Required: this placeholder has no value.";
      if (!firstInvalid) firstInvalid = field;
    } else {
      vars[name] = value;
    }
  });
  if (firstInvalid) {
    firstInvalid.scrollIntoView({ block: "center", behavior: "smooth" });
    return null;
  }
  return vars;
}

async function renderCurrent() {
  if (!state.currentTemplate) return;
  const variables = collectVariables();
  if (variables === null) return; // validation failed; errors already shown
  try {
    const res = await api(API.render(state.currentTemplate.id), {
      method: "POST",
      body: JSON.stringify({ variables }),
    });
    $("#output").textContent = res.rendered_prompt;
    $("#copyBadge").classList.remove("show");
    if (res.missing_variables && res.missing_variables.length) {
      const note = $("#missingNote");
      note.textContent = "Note: missing value(s) left blank: " + res.missing_variables.join(", ");
      note.classList.add("show");
    } else {
      $("#missingNote").classList.remove("show");
    }
    loadHistory();
  } catch (e) {
    toast("Render failed: " + e.message, true);
  }
}

function copyOutput() {
  const out = $("#output").textContent;
  if (!out.trim()) { toast("Nothing to copy yet.", true); return; }
  const done = () => {
    const badge = $("#copyBadge");
    badge.classList.add("show");
    setTimeout(() => badge.classList.remove("show"), 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(out).then(done).catch(() => fallbackCopy(out, done));
  } else {
    fallbackCopy(out, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (_) { toast("Copy failed.", true); }
  document.body.removeChild(ta);
}

// ---------------------------------------------------------------------------
// History
// ---------------------------------------------------------------------------
async function loadHistory() {
  try {
    const data = await api(API.history + "?limit=50");
    const list = $("#historyList");
    if (!data.history.length) {
      list.innerHTML = `<div class="empty">No generations yet. Render a template to see it here.</div>`;
      return;
    }
    list.innerHTML = data.history.map((h) => `
      <div class="h-item" data-id="${esc(h.id)}">
        <div class="h-top">
          <span class="h-name">${esc(h.template_name || "deleted template")}</span>
          <span class="h-time">${new Date(h.created_at).toLocaleString()}</span>
        </div>
        <pre>${esc(h.rendered_prompt)}</pre>
        <div class="h-vars">
          ${Object.entries(h.variables || {}).map(([k, v]) => `<span class="chip">{{${esc(k)}}} = ${esc(v)}</span>`).join("")}
        </div>
      </div>
    `).join("");
  } catch (e) {
    $("#historyList").innerHTML = `<div class="empty">Could not load history.</div>`;
  }
}

// ---------------------------------------------------------------------------
// Editor modal
// ---------------------------------------------------------------------------
function openEditor(template) {
  state.editingId = template ? template.id : null;
  $("#editorTitle").textContent = template ? "Edit Template" : "New Template";
  $("#fName").value = template ? template.name : "";
  $("#fCategory").value = template ? template.category : "";
  $("#fDescription").value = template ? template.description : "";
  $("#fBody").value = template ? template.body : "";
  ["errName", "errCategory", "errBody"].forEach((id) => ($("#" + id).textContent = ""));
  updateLiveChips();
  // seed datalist with known categories
  $("#categoryOptions").innerHTML = [...state.categories].map((c) => `<option value="${esc(c)}"></option>`).join("");
  $("#editorModal").classList.add("open");
}

function closeEditor() {
  $("#editorModal").classList.remove("open");
  state.editingId = null;
}

function updateLiveChips() {
  const body = $("#fBody").value;
  const placeholders = detectPlaceholders(body);
  const chips = $("#liveChips");
  if (!placeholders.length) {
    chips.innerHTML = `<span class="hint">No placeholders detected yet — add {{variable}} to your body.</span>`;
    return;
  }
  chips.innerHTML = placeholders.map((p) => `<span class="chip hl">{{${esc(p)}}}</span>`).join("");
}

function validateEditorForm() {
  let ok = true;
  const name = $("#fName").value.trim();
  const category = $("#fCategory").value.trim();
  const body = $("#fBody").value.trim();
  $("#errName").textContent = name ? "" : "Name is required.";
  $("#errCategory").textContent = category ? "" : "Category is required.";
  $("#errBody").textContent = body ? "" : "Prompt body is required.";
  if (!name || !category || !body) ok = false;
  return ok ? { name, category, description: $("#fDescription").value.trim(), body: $("#fBody").value } : null;
}

async function saveTemplate() {
  const payload = validateEditorForm();
  if (!payload) return;
  try {
    if (state.editingId) {
      await api(API.templates + "/" + state.editingId, { method: "PUT", body: JSON.stringify(payload) });
      toast("Template updated.");
    } else {
      await api(API.templates, { method: "POST", body: JSON.stringify(payload) });
      toast("Template created.");
    }
    closeEditor();
    await loadTemplates();
  } catch (e) {
    toast("Save failed: " + e.message, true);
  }
}

async function deleteTemplate(id, name) {
  if (!confirm(`Delete template "${name}"?\nHistory entries will be kept but lose their template link.`)) return;
  try {
    await api(API.templates + "/" + id, { method: "DELETE" });
    toast("Template deleted.");
    await loadTemplates();
  } catch (e) {
    toast("Delete failed: " + e.message, true);
  }
}

async function clearHistory() {
  if (!confirm("Delete all generation history?")) return;
  try {
    await api(API.history, { method: "DELETE" });
    toast("History cleared.");
    await loadHistory();
  } catch (e) {
    toast("Clear failed: " + e.message, true);
  }
}

// ---------------------------------------------------------------------------
// Event wiring
// ---------------------------------------------------------------------------
$("#btnNew").addEventListener("click", () => openEditor(null));
$("#btnCancel").addEventListener("click", closeEditor);
$("#editorModal").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeEditor(); });
$("#btnSave").addEventListener("click", saveTemplate);
$("#fBody").addEventListener("input", updateLiveChips);

$("#btnRender").addEventListener("click", renderCurrent);
$("#btnCopy").addEventListener("click", copyOutput);
$("#btnBack").addEventListener("click", () => {
  $("#renderView").classList.remove("open");
  $("#libraryView").style.display = "";
  renderGrid();
});
$("#btnResetForm").addEventListener("click", () => {
  if (state.currentTemplate) buildFillForm(state.currentTemplate.placeholders);
  $("#output").textContent = "";
  $("#missingNote").classList.remove("show");
});

$("#searchInput").addEventListener("input", renderGrid);
$("#categoryFilter").addEventListener("change", renderGrid);
$("#btnClearFilters").addEventListener("click", () => {
  $("#searchInput").value = "";
  $("#categoryFilter").value = "";
  renderGrid();
});
$("#btnClearHistory").addEventListener("click", clearHistory);

// delegated card actions
$("#templateGrid").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const card = btn.closest(".card");
  const id = card.dataset.id;
  const t = state.templates.find((x) => x.id === id);
  if (!t) return;
  const action = btn.dataset.action;
  if (action === "fill") openRenderView(t);
  else if (action === "edit") openEditor(t);
  else if (action === "delete") deleteTemplate(id, t.name);
});

// clicking a history item copies its rendered prompt back into the output
$("#historyList").addEventListener("click", (e) => {
  const item = e.target.closest(".h-item");
  if (!item) return;
  const text = item.querySelector("pre").textContent;
  $("#output").textContent = text;
  $("#copyBadge").classList.remove("show");
  toast("Loaded into output panel. Click Copy to reuse it.");
});

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
(async function init() {
  await loadTemplates();
  await loadHistory();
})();
</script>
</body>
</html>
