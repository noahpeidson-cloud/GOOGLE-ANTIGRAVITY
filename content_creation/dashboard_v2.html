<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AntiGravity Media Review Dashboard for Omnichannel content creation.">
    <title>AntiGravity Media Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

    <div class="sidebar">
        <h2>Queue (<span id="queueCount">0</span>)</h2>
        <div id="queueList" class="queue-list-container">
            <!-- Items injected here via JS -->
        </div>
        
        <div class="chat-container">
            <h2 class="chat-header">AI Editor</h2>
            <div id="chatHistory" class="chat-history">
                <div class="chat-msg chat-agent">Hi! Prompt me to trim, rebuild the timeline, or export.</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="e.g. rebuild timeline..." />
                <button id="btnSendChat">Send</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div id="playerArea" class="player-area">
            <div class="video-container">
                <video id="vidPlayer" controls></video>
            </div>

            <div class="controls-panel">
                <div class="time-display">
                    <div>Playhead: <span id="timeCurrent">00:00.00</span> / <span id="timeTotal">00:00.00</span></div>
                    <div>Trim: <span id="timeTrimIn" class="accent">00:00.00</span> to <span id="timeTrimOut" class="accent">End</span></div>
                </div>

                <div class="scrubber-container" id="scrubber">
                    <div class="scrubber-track"></div>
                    <div class="trim-highlight" id="trimHighlight" style="left: 0%; width: 100%;"></div>
                    <div class="playhead" id="playhead" style="left: 0%;"></div>
                </div>

                <div class="button-row">
                    <div class="premium-toolbar">
                        <button class="toolbar-btn" id="btnSetIn">Set IN</button>
                        <button class="toolbar-btn" id="btnSetOut">Set OUT</button>
                        <button class="toolbar-btn" id="btnResetTrim">Reset Trim</button>
                    </div>
                    <div class="premium-toolbar">
                        <button class="toolbar-btn" id="btnQuickShort">YT Short (9:16)</button>
                        <button class="toolbar-btn" id="btnQuickTrim">Trim & Cut</button>
                        <button class="toolbar-btn primary" id="btnCouncilThink">Council Think</button>
                        <button class="toolbar-btn primary" id="btnQuickRebuild">Rebuild</button>
                        <button class="toolbar-btn danger" id="btnQuickExport">Export</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="draftPanel" class="draft-panel">
            <h3 class="draft-title">Pending Polyglot Render (Review)</h3>
            <div id="draftConcept" class="draft-concept"></div>
            <div id="draftSummary" class="draft-summary"></div>
            <button id="btnCommitRender" class="toolbar-btn primary btn-full-width">Commit & Render</button>
        </div>
        
        <div id="emptyArea" class="empty-state">
            All caught up! No assets require review.
        </div>
    </main>

    <script src="/static/dashboard.js"></script>
</body>
</html>
