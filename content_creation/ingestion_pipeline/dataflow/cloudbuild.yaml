steps:
  # Build the custom worker/launcher image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/video-ingestion-dataflow:latest', '.']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/video-ingestion-dataflow:latest']

  # Build the Flex Template
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'dataflow'
      - 'flex-template'
      - 'build'
      - 'gs://$_TEMPLATE_BUCKET/templates/video-ingestion-template.json'
      - '--image'
      - 'gcr.io/$PROJECT_ID/video-ingestion-dataflow:latest'
      - '--sdk-language'
      - 'PYTHON'
      - '--metadata-file'
      - 'metadata.json'

substitutions:
  _TEMPLATE_BUCKET: "your-gcs-bucket-name"
