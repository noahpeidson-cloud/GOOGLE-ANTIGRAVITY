[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    tier1: Tier 1 isolated feature tests
    tier2: Tier 2 boundary and corner case tests
    tier3: Tier 3 pairwise integration tests
    tier4: Tier 4 end-to-end workload and user journey tests
    tier5: Tier 5 adversarial and stress tests
    e2e: End-to-end integration tests
    media: Tests requiring procedural FFmpeg media generation
addopts = -v -ra --strict-markers
