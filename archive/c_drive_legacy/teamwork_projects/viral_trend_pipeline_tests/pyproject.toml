[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-trend-pipeline"
version = "0.1.0"
description = "Viral Trend Pipeline integration test suite and data processing engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --durations=10"
pythonpath = ["src"]
