<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 16px;
      color: #38bdf8;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      background-color: #1e293b;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .message {
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
    .user { color: #94a3b8; }
    .agent { color: #f8fafc; }
    
    .input-container {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
    }
    button {
      padding: 10px 16px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #0369a1; }
  </style>
</head>
<body>
  <h1>Antigravity Master Mind</h1>
  <div id="chat-log">
    <div class="message agent"><strong>System:</strong> Extension loaded. Waiting for context...</div>
  </div>
  <div class="input-container">
    <input type="text" id="user-input" placeholder="Ask about this tab...">
    <button id="send-btn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
