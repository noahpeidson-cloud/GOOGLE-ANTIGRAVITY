<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zero Friction Capture</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: #f9f9f9; color: #333; }
    h2 { font-size: 16px; margin-top: 0; }
    button { 
      background: #007bff; color: white; border: none; padding: 8px 12px; 
      border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 12px;
      font-weight: bold;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { font-size: 12px; color: #666; margin-bottom: 12px; min-height: 16px; }
    textarea { 
      width: 100%; height: 300px; box-sizing: border-box; 
      padding: 8px; border: 1px solid #ccc; border-radius: 4px;
      font-family: monospace; font-size: 12px; resize: vertical;
    }
    .success { color: green !important; }
    .error { color: red !important; }
  </style>
</head>
<body>
  <h2>Zero Friction Capture</h2>
  
  <button id="captureBtn">Capture & Summarize Page</button>
  <div id="status">Ready</div>
  
  <textarea id="resultArea" placeholder="Structured JSON will appear here..."></textarea>
  <button id="saveBtn" style="margin-top: 12px; background: #28a745;" disabled>Save to Local Inbox</button>

  <script src="sidepanel.js"></script>
</body>
</html>
